<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA GAMES | قريباً</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="icon.ico">
    <link rel="stylesheet" href="style_soon.css">
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="neon-glow-orbs">
        <div class="orb blue-orb"></div>
        <div class="orb red-orb"></div>
    </div>
    <div class="scanlines"></div>

    <main class="error-page-wrapper">
        <h1 class="logo-title-wrapper glitch-title" dir="ltr">
            <span class="word-mega">MEGA</span><span class="word-games">GAMES</span>
        </h1>
        
        <div class="cyber-icons">
            <i class="fas fa-server icon-blue"></i>
            <i class="fas fa-bolt icon-mix"></i>
            <i class="fas fa-gamepad icon-red"></i>
        </div>
        
        <div class="store-tag">HARDWARE STORE & DATA SERVICES</div>
        
        <div class="error-message">
            <h1>بنرص أقوى التجميعات وكروت الشاشة على الرف!</h1>
            <p class="clean-description">
                من الآخر.. بنقفل الـ <span class="highlight-blue">Ultimate Store</span> بأقوى هاردوير وبنجهز مكتبة الداتا،<br>
                اطبخ ميزانيتك، وظبط الـ Setup بتاعك عشان اللي جاي <span class="highlight-red">دمار شامل!</span>
            </p>
        </div>

        <div class="neon-countdown orbitron" dir="ltr">
            <div class="capsule-box">
                <span id="days">00</span>
                <small>DAYS</small>
            </div>
            <div class="capsule-dots">:</div>
            <div class="capsule-box">
                <span id="hours">00</span>
                <small>HOURS</small>
            </div>
            <div class="capsule-dots">:</div>
            <div class="capsule-box">
                <span id="minutes">00</span>
                <small>MINS</small>
            </div>
            <div class="capsule-dots">:</div>
            <div class="capsule-box">
                <span id="seconds">00</span>
                <small>SECS</small>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar-wrapper">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <div class="progress-text orbitron">
                <span>LOADING_STORE_ASSETS...</span>
                <span id="progress-percent">0%</span>
            </div>
        </div>
    </main>

    <script src="script_soon.js"></script>
</body>
</html>
